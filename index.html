<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Changes: Tug-of-War Host</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body { 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      text-align: center; 
      color: #f8fafc; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2vw;
      overflow-x: hidden;
      position: relative;

      /* MOVING ANIMATED GRADIENT BACKGROUND */
      background: linear-gradient(-45deg, #090d16, #1e1b4b, #0f172a, #311042);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ANIMATED TITLE WRAPPER */
    .game-title {
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2px;
    }

    /* LETTER COLOR CYCLE & SELECTIVE GLOW */
    .char {
      display: inline-block;
      animation: colorCycle 4s linear infinite;
    }

    /* Staggering the color timing for each letter */
    .char:nth-child(1) { animation-delay: 0.0s; }
    .char:nth-child(2) { animation-delay: 0.2s; }
    .char:nth-child(3) { animation-delay: 0.4s; }
    .char:nth-child(4) { animation-delay: 0.6s; }
    .char:nth-child(5) { animation-delay: 0.8s; }
    .char:nth-child(6) { animation-delay: 1.0s; }
    .char:nth-child(7) { animation-delay: 1.2s; }
    .char:nth-child(8) { animation-delay: 1.4s; }
    .char:nth-child(9) { animation-delay: 1.6s; }
    .char:nth-child(10) { animation-delay: 1.8s; }
    .char:nth-child(11) { animation-delay: 2.0s; }
    .char:nth-child(12) { animation-delay: 2.2s; }
    .char:nth-child(13) { animation-delay: 2.4s; }
    .char:nth-child(14) { animation-delay: 2.6s; }
    .char:nth-child(15) { animation-delay: 2.8s; }
    .char:nth-child(16) { animation-delay: 3.0s; }

    /* GLOWING EFFECT ON SELECTIVE LETTERS ONLY */
    .glow {
      text-shadow: 0 0 12px currentColor, 0 0 24px currentColor;
      font-weight: 900;
    }

    @keyframes colorCycle {
      0% { color: #ef4444; }
      20% { color: #f59e0b; }
      40% { color: #10b981; }
      60% { color: #3b82f6; }
      80% { color: #8b5cf6; }
      100% { color: #ef4444; }
    }

    /* TIMER */
    .timer { 
      font-size: clamp(2.5rem, 6vw, 4.5rem); 
      font-weight: 900; 
      color: #facc15; 
      font-family: monospace; 
      text-shadow: 0 0 15px rgba(250,204,21,0.5);
      z-index: 1; 
      transition: all 0.3s;
    }
    .timer.sudden-death { color: #ef4444; text-shadow: 0 0 25px #ef4444; animation: flashRed 0.5s infinite alternate; }
    @keyframes flashRed { from { transform: scale(1); } to { transform: scale(1.1); } }

    /* DASHBOARD */
    .dashboard { 
      display: flex; 
      justify-content: space-around; 
      width: 100%;
      max-width: 1000px; 
      margin: 10px auto; 
      background: rgba(30, 41, 59, 0.7); 
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: clamp(10px, 2vw, 20px); 
      border-radius: 20px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      z-index: 1;
    }
    .score { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 900; }
    .red-txt { color: #ef4444; text-shadow: 0 0 15px rgba(239,68,68,0.5); }
    .blue-txt { color: #3b82f6; text-shadow: 0 0 15px rgba(59,130,246,0.5); }

    /* ARENA */
    .arena { 
      background: rgba(15, 23, 42, 0.8); 
      padding: clamp(40px, 6vw, 80px) 10px; 
      margin: 15px auto; 
      border-radius: 24px; 
      width: 100%;
      max-width: 1100px; 
      position: relative; 
      overflow: hidden; 
      border: 1px solid rgba(255,255,255,0.05);
      z-index: 1;
    }
    .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: rgba(239,68,68,0.8); box-shadow: 0 0 10px #ef4444; z-index: 1; }

    /* ROPE & CHARACTERS */
    .rope-wrapper { display: flex; align-items: center; justify-content: center; transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); position: relative; z-index: 2; }
    
    .real-rope { 
      width: clamp(200px, 40vw, 450px); 
      height: clamp(14px, 2vw, 24px); 
      background-image: repeating-linear-gradient(45deg, #78350f, #78350f 10px, #b45309 10px, #b45309 20px, #d97706 20px, #d97706 25px);
      margin: 0 -10px; border-radius: 12px; box-shadow: 0 8px 15px rgba(0,0,0,0.6); position: relative;
    }

    .center-flag { 
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%); 
      font-size: clamp(1.8rem, 3vw, 2.5rem); 
      animation: flagWiggle 1s infinite alternate ease-in-out; 
    }
    @keyframes flagWiggle { from { transform: translateX(-50%) rotate(-5deg); } to { transform: translateX(-50%) rotate(5deg); } }

    .team-players { display: flex; gap: clamp(4px, 1vw, 12px); }
    .player-container { 
      position: relative; 
      font-size: clamp(2rem, 4vw, 3.5rem); 
      display: inline-block; 
      transition: transform 0.3s ease;
      animation: idleBob 1.5s infinite alternate ease-in-out;
    }
    @keyframes idleBob { from { transform: translateY(0); } to { transform: translateY(-6px); } }

    .pull-left .player-container { transform: rotate(-20deg) translateX(-10px) scale(1.1); }
    .pull-right .player-container { transform: rotate(20deg) translateX(10px) scale(1.1); }

    .bandana-red::before { content: ''; position: absolute; top: 18%; left: 15%; width: 70%; height: 15%; background: #ef4444; border-radius: 4px; box-shadow: 0 0 8px #ef4444; }
    .bandana-blue::before { content: ''; position: absolute; top: 18%; left: 15%; width: 70%; height: 15%; background: #3b82f6; border-radius: 4px; box-shadow: 0 0 8px #3b82f6; }

    .jumping { animation: victoryJump 0.5s infinite alternate cubic-bezier(0.175, 0.885, 0.32, 1.275) !important; }
    @keyframes victoryJump { from { transform: translateY(0) scale(1); } to { transform: translateY(-35px) scale(1.2); } }

    /* BUTTONS */
    .controls { z-index: 1; }
    button { padding: clamp(10px, 1.5vw, 16px) clamp(20px, 3vw, 32px); font-size: clamp(1rem, 1.5vw, 1.2rem); font-weight: 800; border: none; border-radius: 12px; cursor: pointer; margin: 5px; transition: transform 0.2s, box-shadow 0.2s; }
    button:active { transform: scale(0.95); }
    .start-btn { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; box-shadow: 0 0 15px rgba(34,197,94,0.4); }
    .reset-btn { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 0 15px rgba(239,68,68,0.4); }
  </style>
</head>
<body>

  <!-- ANIMATED COLOR TITLE WITH SELECTIVE GLOW -->
  <div class="game-title">
    <span class="char glow">P</span><span class="char">H</span><span class="char glow">A</span><span class="char">S</span><span class="char">E</span>
    <span class="char">&nbsp;</span>
    <span class="char glow">C</span><span class="char">H</span><span class="char">A</span><span class="char">N</span><span class="char glow">G</span><span class="char">E</span><span class="char">S</span><span class="char">:</span>
    <span class="char">&nbsp;</span>
    <span class="char glow">T</span><span class="char">U</span><span class="char">G</span><span class="char">-</span><span class="char">O</span><span class="char">-</span><span class="char glow">W</span><span class="char">A</span><span class="char">R</span>
  </div>

  <div class="timer" id="timerDisplay">03:00</div>

  <div class="dashboard">
    <div>
      <div class="red-txt" style="font-size: clamp(1.1rem, 2vw, 1.6rem); font-weight: 800;">TEAM RED</div>
      <div class="score red-txt" id="scoreRed">0</div>
      <div id="playersRed" style="opacity: 0.8;">0 Players</div>
    </div>
    <div>
      <div class="blue-txt" style="font-size: clamp(1.1rem, 2vw, 1.6rem); font-weight: 800;">TEAM BLUE</div>
      <div class="score blue-txt" id="scoreBlue">0</div>
      <div id="playersBlue" style="opacity: 0.8;">0 Players</div>
    </div>
  </div>

  <div class="arena">
    <div class="center-line"></div>
    <div class="rope-wrapper" id="ropeWrapper">
      <div class="team-players" id="teamAAvatars">
        <div class="player-container bandana-red">🏃‍♂️</div>
        <div class="player-container bandana-red">🤼‍♀️</div>
        <div class="player-container bandana-red">🏃‍♂️</div>
      </div>

      <div class="real-rope" id="realRope">
        <div class="center-flag">🚩</div>
      </div>

      <div class="team-players" id="teamBAvatars">
        <div class="player-container bandana-blue">🏃‍♀️</div>
        <div class="player-container bandana-blue">🤼‍♂️</div>
        <div class="player-container bandana-blue">🏃‍♀️</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="start-btn" onclick="startGame()">▶ Start 3-Min Match</button>
    <button class="reset-btn" onclick="resetGame()">🔄 Reset Match</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY",
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com",
      projectId: "tug-of-war-game-f18b3",
      storageBucket: "tug-of-war-game-f18b3.firebasestorage.app",
      messagingSenderId: "797664292032",
      appId: "1:797664292032:web:781e254da90da2c43e5125"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameRef = ref(db, "game/state");
    const presenceRef = ref(db, "game/presence");

    let timerInterval = null, confettiInterval = null, lastPos = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    onValue(gameRef, (snapshot) => {
      const data = snapshot.val() || {};
      const pos = data.ropePosition || 0;

      if (pos !== lastPos) {
        triggerPullFX(pos < lastPos ? "A" : "B");
        lastPos = pos;
      }

      const shiftPct = (pos / 100) * 35;
      document.getElementById("ropeWrapper").style.transform = `translateX(${shiftPct}%)`;

      document.getElementById("scoreRed").innerText = data.scoreRed || 0;
      document.getElementById("scoreBlue").innerText = data.scoreBlue || 0;

      if (data.gameOver) {
        clearInterval(timerInterval);
        handleWinnerDisplay(data.winner, pos);
      }
    });

    onValue(presenceRef, (snapshot) => {
      const data = snapshot.val() || {};
      let red = 0, blue = 0;
      Object.values(data).forEach(p => { if (p.team === "A") red++; else blue++; });
      document.getElementById("playersRed").innerText = `${red} Players`;
      document.getElementById("playersBlue").innerText = `${blue} Players`;
    });

    function triggerPullFX(pullingTeam) {
      const teamA = document.getElementById("teamAAvatars");
      const teamB = document.getElementById("teamBAvatars");

      if (pullingTeam === "A") teamA.classList.add("pull-left");
      else teamB.classList.add("pull-right");

      playSound(120, "sawtooth", 0.15);

      setTimeout(() => {
        teamA.classList.remove("pull-left");
        teamB.classList.remove("pull-right");
      }, 300);
    }

    window.startGame = function() {
      let timeLeft = 180;
      clearInterval(timerInterval); clearInterval(confettiInterval);
      set(gameRef, { ropePosition: 0, scoreRed: 0, scoreBlue: 0, timerSecs: 180, gameOver: false, winner: null });

      timerInterval = setInterval(() => {
        timeLeft--;
        const timerDisp = document.getElementById("timerDisplay");

        if (timeLeft <= 30) {
          timerDisp.className = "timer sudden-death";
          timerDisp.innerText = `⚡ ${timeLeft}s`;
        } else {
          timerDisp.className = "timer";
          const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
          const s = (timeLeft % 60).toString().padStart(2, '0');
          timerDisp.innerText = `${m}:${s}`;
        }

        set(gameRef, { ...getLatestState(), timerSecs: timeLeft });

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          let state = getLatestState();
          let winner = state.ropePosition < 0 ? "A" : (state.ropePosition > 0 ? "B" : "TIE");
          set(gameRef, { ...state, gameOver: true, winner: winner });
        }
      }, 1000);
    };

    function handleWinnerDisplay(winner, pos) {
      const teamA = document.getElementById("teamAAvatars");
      const teamB = document.getElementById("teamBAvatars");
      teamA.classList.remove("jumping"); teamB.classList.remove("jumping");

      if (winner === "A" || pos < 0) { teamA.classList.add("jumping"); triggerVictoryFanfare(); }
      else if (winner === "B" || pos > 0) { teamB.classList.add("jumping"); triggerVictoryFanfare(); }
    }

    function triggerVictoryFanfare() {
      playSound(523.25, "triangle", 0.3);
      setTimeout(() => playSound(659.25, "triangle", 0.3), 150);
      setTimeout(() => playSound(783.99, "triangle", 0.6), 300);

      clearInterval(confettiInterval);
      confettiInterval = setInterval(() => { confetti({ particleCount: 60, spread: 80, origin: { y: 0.6 } }); }, 600);
    }

    function getLatestState() {
      let r = parseInt(document.getElementById("scoreRed").innerText) || 0;
      let b = parseInt(document.getElementById("scoreBlue").innerText) || 0;
      return { scoreRed: r, scoreBlue: b, ropePosition: lastPos };
    }

    window.resetGame = function() {
      clearInterval(timerInterval); clearInterval(confettiInterval);
      const timerDisp = document.getElementById("timerDisplay");
      timerDisp.className = "timer"; timerDisp.innerText = "03:00";
      document.getElementById("teamAAvatars").classList.remove("jumping");
      document.getElementById("teamBAvatars").classList.remove("jumping");
      set(gameRef, { ropePosition: 0, scoreRed: 0, scoreBlue: 0, timerSecs: 180, gameOver: false, winner: null });
    };
  </script>
</body>
</html>
