<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Changes: Tug-of-War Host Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: 'Fredoka', sans-serif;
      text-align: center;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #000000);
      background-size: 300% 300%;
      animation: ambientBG 18s ease infinite;
      overflow: hidden;
    }

    @keyframes ambientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* HEADER & STATS BAR */
    .header-bar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 16px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .title-box h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff5263, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-pill {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 8px 18px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #facc15;
    }

    /* MAIN MATCH ARENA */
    .arena-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin: 1rem 0;
    }

    /* SCOREBOARD DISPLAY */
    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .team-card {
      flex: 1;
      padding: 20px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    .team-red-card {
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid rgba(239, 68, 68, 0.4);
    }

    .team-blue-card {
      background: rgba(2, 132, 199, 0.15);
      border: 2px solid rgba(2, 132, 199, 0.4);
    }

    .team-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .red-text { color: #ff5263; }
    .blue-text { color: #38bdf8; }

    .team-score {
      font-family: 'Outfit', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1;
    }

    .timer-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 16px 28px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 160px;
    }

    .timer-label { font-size: 0.85rem; opacity: 0.7; font-weight: 700; text-transform: uppercase; }
    .timer-display { font-family: 'Outfit', sans-serif; font-size: 2.8rem; font-weight: 900; color: #facc15; }

    /* TUG OF WAR ROPE & TRACK */
    .rope-track-wrapper {
      position: relative;
      width: 100%;
      height: 140px;
      background: rgba(10, 15, 30, 0.85);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 40px;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    }

    .win-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      z-index: 2;
    }
    .win-left { left: 15%; background: #ff5263; box-shadow: 0 0 15px #ff5263; }
    .win-right { right: 15%; background: #38bdf8; box-shadow: 0 0 15px #38bdf8; }
    .center-mark { left: 50%; width: 2px; background: rgba(255,255,255,0.2); transform: translateX(-50%); }

    .rope {
      position: absolute;
      width: 120%;
      height: 16px;
      background: repeating-linear-gradient(45deg, #d97706, #d97706 15px, #b45309 15px, #b45309 30px);
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .flag {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 64px;
      background: #facc15;
      border-radius: 6px;
      box-shadow: 0 0 20px #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    /* HOST CONTROLS FOOTER */
    .controls-bar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .btn {
      padding: 16px 32px;
      border-radius: 50px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }
    .btn:active { transform: scale(0.96); }

    .start-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
    }

    .reset-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
    }

    .clear-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
    }

    .presence-badge {
      font-size: 1.1rem;
      font-weight: 700;
      opacity: 0.85;
    }

    /* FULLSCREEN DRAMATIC COUNTDOWN OVERLAY FOR HOST */
    .countdown-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .cd-number {
      font-family: 'Outfit', sans-serif;
      font-size: 14rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 40px rgba(250, 204, 21, 0.9), 0 0 80px rgba(250, 204, 21, 0.5);
      animation: cdPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
    }

    .cd-label {
      font-family: 'Outfit', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 6px;
      color: #ffffff;
      text-transform: uppercase;
    }

    @keyframes cdPop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- DRAMATIC COUNTDOWN OVERLAY FOR HOST SCREEN -->
  <div class="countdown-overlay" id="hostCdOverlay">
    <div class="cd-label">GET READY</div>
    <div class="cd-number" id="hostCdNum">3</div>
  </div>

  <!-- HEADER -->
  <div class="header-bar">
    <div class="title-box">
      <h1>PHASE CHANGES TUG-OF-WAR</h1>
    </div>
    <div class="status-pill" id="gameStatusPill">WAITING TO START</div>
  </div>

  <!-- MAIN ARENA -->
  <div class="arena-container">
    <div class="scoreboard">
      <div class="team-card team-red-card">
        <div class="team-name red-text">TEAM RED</div>
        <div class="team-score red-text" id="scoreRed">0</div>
        <div style="font-size: 0.9rem; opacity: 0.8;" id="playersRed">0 Players</div>
      </div>

      <div class="timer-card">
        <div class="timer-label">TIME REMAINING</div>
        <div class="timer-display" id="timerDisplay">02:00</div>
      </div>

      <div class="team-card team-blue-card">
        <div class="team-name blue-text">TEAM BLUE</div>
        <div class="team-score blue-text" id="scoreBlue">0</div>
        <div style="font-size: 0.9rem; opacity: 0.8;" id="playersBlue">0 Players</div>
      </div>
    </div>

    <!-- ROPE TRACK -->
    <div class="rope-track-wrapper">
      <div class="win-line win-left"></div>
      <div class="win-line center-mark"></div>
      <div class="win-line win-right"></div>

      <div class="rope" id="ropeEl">
        <div class="flag">🚩</div>
      </div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-bar">
    <div class="presence-badge" id="totalPlayersBadge">👥 0 Students Joined</div>
    <div style="display: flex; gap: 12px;">
      <button class="btn start-btn" onclick="startMatch()">START MATCH</button>
      <button class="btn reset-btn" onclick="resetMatch()">RESET ARENA</button>
      <button class="btn clear-btn" onclick="clearRoster()">CLEAR ROSTER</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY",
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com",
      projectId: "tug-of-war-game-f18b3"
    });

    const db = getDatabase(app);
    const gameStateRef = ref(db, "game/state");
    const pullsRef = ref(db, "game/pulls");
    const presenceRef = ref(db, "game/presence");

    const WIN_THRESHOLD = 300;
    let ropePosition = 0;
    let scoreA = 0, scoreB = 0;
    let matchTimerInterval = null;
    let currentMatchTime = 120;
    let lastCdVal = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    // LISTEN TO GAME STATE
    onValue(gameStateRef, (snapshot) => {
      const data = snapshot.val() || {};
      const statusPill = document.getElementById("gameStatusPill");
      const cdOverlay = document.getElementById("hostCdOverlay");
      const cdNum = document.getElementById("hostCdNum");

      if (data.status === "countdown") {
        const cdVal = data.countdownVal !== undefined ? data.countdownVal : "3";
        cdOverlay.style.display = "flex";
        cdNum.innerText = cdVal;

        if (cdVal !== lastCdVal) {
          playBeep(cdVal === "GO!" ? 880 : 440, "triangle", 0.25);
          lastCdVal = cdVal;
        }

        statusPill.innerText = "GET READY!";
        statusPill.style.color = "#facc15";
      } else {
        cdOverlay.style.display = "none";
        lastCdVal = null;

        if (data.status === "playing") {
          const isSuddenDeath = data.timerSecs !== undefined && data.timerSecs <= 30;
          statusPill.innerText = isSuddenDeath ? "🔥 SUDDEN DEATH 2X!" : "MATCH IN PROGRESS";
          statusPill.style.color = isSuddenDeath ? "#ff2a5f" : "#4ade80";
        } else if (data.status === "ended") {
          statusPill.innerText = `MATCH OVER - WINNER: ${data.winner === 'A' ? 'RED TEAM' : (data.winner === 'B' ? 'BLUE TEAM' : 'TIE')}`;
          statusPill.style.color = "#ef4444";
        } else {
          statusPill.innerText = "WAITING TO START";
          statusPill.style.color = "#facc15";
        }
      }
    });

    // LISTEN TO PLAYER PRESENCE
    onValue(presenceRef, (snapshot) => {
      const players = snapshot.val() || {};
      let countA = 0, countB = 0;

      Object.values(players).forEach(p => {
        if (p.team === 'A') countA++;
        if (p.team === 'B') countB++;
      });

      document.getElementById("playersRed").innerText = `${countA} Players`;
      document.getElementById("playersBlue").innerText = `${countB} Players`;
      document.getElementById("totalPlayersBadge").innerText = `👥 ${countA + countB} Students Joined`;
    });

    // PROCESS LIVE PULL QUEUE FROM STUDENTS
    onChildAdded(pullsRef, (snapshot) => {
      const pull = snapshot.val();
      if (!pull) return;

      if (pull.team === 'A') {
        ropePosition -= pull.force;
        scoreA += pull.points;
      } else if (pull.team === 'B') {
        ropePosition += pull.force;
        scoreB += pull.points;
      }

      ropePosition = Math.max(-WIN_THRESHOLD, Math.min(WIN_THRESHOLD, ropePosition));

      document.getElementById("ropeEl").style.transform = `translateX(${ropePosition}px)`;
      document.getElementById("scoreRed").innerText = scoreA;
      document.getElementById("scoreBlue").innerText = scoreB;

      if (Math.abs(ropePosition) >= WIN_THRESHOLD) {
        endMatch(ropePosition <= -WIN_THRESHOLD ? 'A' : 'B');
      }
    });

    // START MATCH WITH SYNCHRONIZED DRAMATIC COUNTDOWN
    window.startMatch = function() {
      resetMatchData();
      let count = 3;

      set(gameStateRef, {
        status: "countdown",
        countdownVal: count,
        timerSecs: 120
      });

      const cdInterval = setInterval(() => {
        count--;
        if (count > 0) {
          update(gameStateRef, { countdownVal: count });
        } else if (count === 0) {
          update(gameStateRef, { countdownVal: "GO!" });
        } else {
          clearInterval(cdInterval);
          update(gameStateRef, { status: "playing", countdownVal: null });
          startTimer();
        }
      }, 1000);
    };

    function startTimer() {
      currentMatchTime = 120;
      clearInterval(matchTimerInterval);

      matchTimerInterval = setInterval(() => {
        currentMatchTime--;
        
        const mins = String(Math.floor(currentMatchTime / 60)).padStart(2, '0');
        const secs = String(currentMatchTime % 60).padStart(2, '0');
        document.getElementById("timerDisplay").innerText = `${mins}:${secs}`;

        update(gameStateRef, { timerSecs: currentMatchTime });

        if (currentMatchTime <= 0) {
          clearInterval(matchTimerInterval);

          let winnerTeam = "TIE";
          if (ropePosition <= -WIN_THRESHOLD) winnerTeam = "A";
          else if (ropePosition >= WIN_THRESHOLD) winnerTeam = "B";
          else {
            if (scoreA > scoreB) winnerTeam = "A";
            else if (scoreB > scoreA) winnerTeam = "B";
            else winnerTeam = "TIE";
          }

          endMatch(winnerTeam);
        }
      }, 1000);
    }

    function endMatch(winner) {
      clearInterval(matchTimerInterval);
      update(gameStateRef, {
        status: "ended",
        winner: winner,
        finalScoreA: scoreA,
        finalScoreB: scoreB
      });
    }

    function resetMatchData() {
      ropePosition = 0;
      scoreA = 0;
      scoreB = 0;
      document.getElementById("ropeEl").style.transform = `translateX(0px)`;
      document.getElementById("scoreRed").innerText = "0";
      document.getElementById("scoreBlue").innerText = "0";
      document.getElementById("timerDisplay").innerText = "02:00";
      remove(pullsRef);
    }

    window.resetMatch = function() {
      clearInterval(matchTimerInterval);
      resetMatchData();
      set(gameStateRef, { status: "waiting", timerSecs: 120 });
    };

    // CLEAR ROSTER & REDIRECT ALL STUDENTS TO JOIN MATCH SCREEN
    window.clearRoster = function() {
      clearInterval(matchTimerInterval);
      resetMatchData();
      
      // Wipe player presence & pull history from DB
      remove(presenceRef);
      remove(pullsRef);

      // Reset game state to waiting
      set(gameStateRef, { status: "waiting", timerSecs: 120 });
    };
  </script>
</body>
</html>
