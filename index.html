<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Changes: Host Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: 'Fredoka', sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #38bdf8, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .status-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(250, 204, 21, 0.2);
      color: #facc15;
      border: 1px solid #facc15;
      font-family: 'Outfit', sans-serif;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .btn {
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-start { background: linear-gradient(135deg, #16a34a, #22c55e); }
    .btn-reset { background: linear-gradient(135deg, #dc2626, #ef4444); }

    .score-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      text-align: center;
    }

    .team-card {
      padding: 1.5rem;
      border-radius: 16px;
      background: rgba(0,0,0,0.3);
    }
    .team-card.red { border: 2px solid #ef4444; }
    .team-card.blue { border: 2px solid #0284c7; }

    .score-num {
      font-family: 'Outfit', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      margin-top: 0.5rem;
    }
    .red .score-num { color: #f87171; }
    .blue .score-num { color: #38bdf8; }

    .timer-display {
      font-family: 'Outfit', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      text-align: center;
      color: #facc15;
    }

    #errorBanner {
      display: none;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>HOST DASHBOARD</h1>

    <div id="errorBanner">
      ⚠️ <strong>Permission Denied:</strong> Update Realtime Database Security Rules in Firebase Console to <code>.read: true, .write: true</code>.
    </div>

    <!-- MAIN CONTROLS -->
    <div class="panel">
      <div class="status-box">
        <span>GAME STATUS:</span>
        <span class="status-badge" id="hostStatus">WAITING</span>
      </div>
      <div class="timer-display" id="timerDisplay">02:00</div>
      <div class="controls" style="margin-top: 1rem;">
        <button class="btn btn-start" id="startBtn" onclick="startMatch()">START MATCH</button>
        <button class="btn btn-reset" onclick="resetMatch()">RESET GAME</button>
      </div>
    </div>

    <!-- LIVE SCORES -->
    <div class="panel">
      <h2 style="font-family: 'Outfit'; font-size: 1.2rem; margin-bottom: 1rem;">LIVE SCORE TRACKER</h2>
      <div class="score-board">
        <div class="team-card red">
          <h3>RED TEAM</h3>
          <div class="score-num" id="redScore">0</div>
        </div>
        <div class="team-card blue">
          <h3>BLUE TEAM</h3>
          <div class="score-num" id="blueScore">0</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY", 
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com", 
      projectId: "tug-of-war-game-f18b3"
    });

    const db = getDatabase(app);
    const stateRef = ref(db, "game/state");
    const pullsRef = ref(db, "game/pulls");

    let timerInterval = null;
    let cdInterval = null;
    let matchTimeSecs = 120; // 2 Minutes match

    // Handle database permission errors
    function checkPermissionError(err) {
      if (err && err.message && err.message.includes("PERMISSION_DENIED")) {
        document.getElementById("errorBanner").style.display = "block";
      }
    }

    // Start Countdown and Match Process
    window.startMatch = function() {
      document.getElementById("startBtn").disabled = true;

      let cd = 3;
      set(stateRef, { status: "countdown", countdownVal: cd }).catch(checkPermissionError);

      cdInterval = setInterval(() => {
        cd--;
        if (cd > 0) {
          set(stateRef, { status: "countdown", countdownVal: cd }).catch(checkPermissionError);
        } else if (cd === 0) {
          set(stateRef, { status: "countdown", countdownVal: "GO!" }).catch(checkPermissionError);
        } else {
          clearInterval(cdInterval);
          beginPlay();
        }
      }, 1000);
    };

    function beginPlay() {
      matchTimeSecs = 120;
      updateGameState("playing", matchTimeSecs);

      timerInterval = setInterval(() => {
        matchTimeSecs--;
        updateGameState("playing", matchTimeSecs);

        if (matchTimeSecs <= 0) {
          endMatch();
        }
      }, 1000);
    }

    function updateGameState(status, secs) {
      set(stateRef, {
        status: status,
        timerSecs: secs
      }).catch(checkPermissionError);
    }

    function endMatch() {
      clearInterval(timerInterval);
      
      const redScore = parseInt(document.getElementById("redScore").innerText);
      const blueScore = parseInt(document.getElementById("blueScore").innerText);

      let winner = "TIE";
      if (redScore > blueScore) winner = "A";
      else if (blueScore > redScore) winner = "B";

      set(stateRef, {
        status: "ended",
        winner: winner,
        timerSecs: 0
      }).catch(checkPermissionError);

      document.getElementById("startBtn").disabled = false;
    }

    window.resetMatch = function() {
      clearInterval(timerInterval);
      clearInterval(cdInterval);

      set(stateRef, { status: "waiting", timerSecs: 120 }).catch(checkPermissionError);
      set(pullsRef, null).catch(checkPermissionError);

      document.getElementById("startBtn").disabled = false;
      document.getElementById("timerDisplay").innerText = "02:00";
      document.getElementById("redScore").innerText = "0";
      document.getElementById("blueScore").innerText = "0";
    };

    // Listen to Game State
    onValue(stateRef, (snapshot) => {
      const data = snapshot.val() || {};
      const status = data.status || "waiting";
      const secs = data.timerSecs !== undefined ? data.timerSecs : 120;

      document.getElementById("hostStatus").innerText = status.toUpperCase();

      const mins = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = (secs % 60).toString().padStart(2, '0');
      document.getElementById("timerDisplay").innerText = `${mins}:${s}`;
    }, (err) => checkPermissionError(err));

    // Listen to Live Pulls & Sum Scores
    onValue(pullsRef, (snapshot) => {
      const pulls = snapshot.val() || {};
      let redTotal = 0;
      let blueTotal = 0;

      Object.values(pulls).forEach(p => {
        if (p.team === 'A') redTotal += (p.points || 5);
        if (p.team === 'B') blueTotal += (p.points || 5);
      });

      document.getElementById("redScore").innerText = redTotal;
      document.getElementById("blueScore").innerText = blueTotal;
    }, (err) => checkPermissionError(err));
  </script>
</body>
</html>
