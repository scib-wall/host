<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tug-of-War Host Arena</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; overflow-x: hidden; }

    /* SCREEN SHAKE ANIMATION */
    .shake { animation: arenaShake 0.25s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes arenaShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    /* TIMER DISPLAY */
    .timer { font-size: 3.8rem; font-weight: bold; color: #facc15; font-family: monospace; letter-spacing: 2px; transition: color 0.3s; }
    .timer.sudden-death { color: #ef4444; animation: flashRed 0.5s infinite alternate; }
    @keyframes flashRed { from { transform: scale(1); } to { transform: scale(1.08); } }

    .dashboard { display: flex; justify-content: space-around; max-width: 900px; margin: 20px auto; background: #1e293b; padding: 20px; border-radius: 16px; }
    .score { font-size: 3rem; font-weight: bold; }
    .red-txt { color: #ef4444; }
    .blue-txt { color: #3b82f6; }

    /* REAL BRAIDED ROPE */
    .arena { background: #334155; padding: 75px 10px 55px 10px; margin: 25px auto; border-radius: 20px; max-width: 950px; position: relative; overflow: hidden; }
    .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #ef4444; z-index: 1; }

    .rope-wrapper { display: flex; align-items: center; justify-content: center; transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); position: relative; z-index: 2; }
    
    .real-rope { 
      width: 420px; height: 22px; 
      background-image: repeating-linear-gradient(45deg, #78350f, #78350f 10px, #b45309 10px, #b45309 20px, #d97706 20px, #d97706 25px);
      margin: 0 -10px; border-radius: 10px; box-shadow: 0 5px 8px rgba(0,0,0,0.4); position: relative;
      transition: transform 0.2s;
    }
    .rope-strained { transform: scaleX(1.05); }

    .center-flag { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); font-size: 2rem; z-index: 10; }

    /* LEANING PLAYER AVATARS */
    .team-players { display: flex; gap: 8px; transition: transform 0.3s; }
    .player-container { position: relative; font-size: 3rem; display: inline-block; transition: transform 0.3s; }

    /* PULLING LEAN STANCE */
    .pull-left .player-container { transform: rotate(-15deg) translateX(-5px); }
    .pull-right .player-container { transform: rotate(15deg) translateX(5px); }

    .bandana-red::before { content: ''; position: absolute; top: 10px; left: 8px; width: 32px; height: 7px; background: #ef4444; border-radius: 4px; }
    .bandana-blue::before { content: ''; position: absolute; top: 10px; left: 8px; width: 32px; height: 7px; background: #3b82f6; border-radius: 4px; }

    /* JUMPING WINNERS */
    .jumping { animation: jump 0.6s infinite alternate ease-in-out; }
    @keyframes jump { from { transform: translateY(0); } to { transform: translateY(-30px); } }

    .controls { margin-top: 20px; }
    button { padding: 12px 24px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 0 10px; }
    .start-btn { background: #22c55e; color: white; }
    .reset-btn { background: #ef4444; color: white; }
  </style>
</head>
<body id="hostBody">

  <h1>🏆 CLASSROOM TUG-OF-WAR ARENA</h1>
  <div class="timer" id="timerDisplay">03:00</div>

  <div class="dashboard">
    <div>
      <div class="red-txt" style="font-size: 1.5rem; font-weight: bold;">TEAM RED</div>
      <div class="score red-txt" id="scoreRed">0</div>
      <div id="playersRed">0 Players</div>
    </div>
    <div>
      <div class="blue-txt" style="font-size: 1.5rem; font-weight: bold;">TEAM BLUE</div>
      <div class="score blue-txt" id="scoreBlue">0</div>
      <div id="playersBlue">0 Players</div>
    </div>
  </div>

  <div class="arena">
    <div class="center-line"></div>
    <div class="rope-wrapper" id="ropeWrapper">
      <div class="team-players" id="teamAAvatars">
        <div class="player-container bandana-red">🚶‍♂️</div>
        <div class="player-container bandana-red">🚶‍♀️</div>
        <div class="player-container bandana-red">🚶‍♂️</div>
      </div>

      <div class="real-rope" id="realRope">
        <div class="center-flag">🚩</div>
      </div>

      <div class="team-players" id="teamBAvatars">
        <div class="player-container bandana-blue">🚶‍♀️</div>
        <div class="player-container bandana-blue">🚶‍♂️</div>
        <div class="player-container bandana-blue">🚶‍♀️</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="start-btn" onclick="startGame()">Start 3-Min Game</button>
    <button class="reset-btn" onclick="resetGame()">Reset Game</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY",
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com",
      projectId: "tug-of-war-game-f18b3",
      storageBucket: "tug-of-war-game-f18b3.firebasestorage.app",
      messagingSenderId: "797664292032",
      appId: "1:797664292032:web:781e254da90da2c43e5125"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameRef = ref(db, "game/state");
    const presenceRef = ref(db, "game/presence");

    let timerInterval = null;
    let confettiInterval = null;
    let lastPos = 0;

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    onValue(gameRef, (snapshot) => {
      const data = snapshot.val() || {};
      const pos = data.ropePosition || 0;

      // Trigger FX if position shifted
      if (pos !== lastPos) {
        triggerPullFX(pos < lastPos ? "A" : "B");
        lastPos = pos;
      }

      const shiftPct = (pos / 100) * 35;
      document.getElementById("ropeWrapper").style.transform = `translateX(${shiftPct}%)`;

      document.getElementById("scoreRed").innerText = data.scoreRed || 0;
      document.getElementById("scoreBlue").innerText = data.scoreBlue || 0;

      if (data.gameOver) {
        clearInterval(timerInterval);
        handleWinnerDisplay(data.winner, pos);
      }
    });

    onValue(presenceRef, (snapshot) => {
      const data = snapshot.val() || {};
      let red = 0, blue = 0;
      Object.values(data).forEach(p => { if (p.team === "A") red++; else blue++; });
      document.getElementById("playersRed").innerText = `${red} Players`;
      document.getElementById("playersBlue").innerText = `${blue} Players`;
    });

    function triggerPullFX(pullingTeam) {
      // 1. Screen Shake
      const body = document.getElementById("hostBody");
      body.classList.add("shake");
      setTimeout(() => body.classList.remove("shake"), 250);

      // 2. Rope Strain & Avatar Leaning
      const rope = document.getElementById("realRope");
      const teamA = document.getElementById("teamAAvatars");
      const teamB = document.getElementById("teamBAvatars");

      rope.classList.add("rope-strained");
      if (pullingTeam === "A") teamA.classList.add("pull-left");
      else teamB.classList.add("pull-right");

      playSound(120, "sawtooth", 0.15); // Pull sound

      setTimeout(() => {
        rope.classList.remove("rope-strained");
        teamA.classList.remove("pull-left");
        teamB.classList.remove("pull-right");
      }, 300);
    }

    window.startGame = function() {
      let timeLeft = 180;
      clearInterval(timerInterval);
      clearInterval(confettiInterval);

      set(gameRef, { ropePosition: 0, scoreRed: 0, scoreBlue: 0, timerSecs: 180, gameOver: false, winner: null });

      timerInterval = setInterval(() => {
        timeLeft--;
        const timerDisp = document.getElementById("timerDisplay");

        if (timeLeft <= 30) {
          timerDisp.className = "timer sudden-death";
          timerDisp.innerText = `⚡ ${timeLeft}s`;
        } else {
          timerDisp.className = "timer";
          const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
          const s = (timeLeft % 60).toString().padStart(2, '0');
          timerDisp.innerText = `${m}:${s}`;
        }

        set(gameRef, { ...getLatestState(), timerSecs: timeLeft });

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          let state = getLatestState();
          let winner = state.ropePosition < 0 ? "A" : (state.ropePosition > 0 ? "B" : "TIE");
          set(gameRef, { ...state, gameOver: true, winner: winner });
        }
      }, 1000);
    };

    function handleWinnerDisplay(winner, pos) {
      const teamA = document.getElementById("teamAAvatars");
      const teamB = document.getElementById("teamBAvatars");

      teamA.classList.remove("jumping");
      teamB.classList.remove("jumping");

      if (winner === "A" || pos < 0) {
        teamA.classList.add("jumping");
        triggerVictoryFanfare();
      } else if (winner === "B" || pos > 0) {
        teamB.classList.add("jumping");
        triggerVictoryFanfare();
      }
    }

    function triggerVictoryFanfare() {
      // Fanfare Sound
      playSound(523.25, "triangle", 0.3);
      setTimeout(() => playSound(659.25, "triangle", 0.3), 150);
      setTimeout(() => playSound(783.99, "triangle", 0.6), 300);

      // Confetti Cannon
      clearInterval(confettiInterval);
      confettiInterval = setInterval(() => {
        confetti({ particleCount: 60, spread: 80, origin: { y: 0.6 } });
      }, 600);
    }

    function getLatestState() {
      let r = parseInt(document.getElementById("scoreRed").innerText) || 0;
      let b = parseInt(document.getElementById("scoreBlue").innerText) || 0;
      return { scoreRed: r, scoreBlue: b, ropePosition: lastPos };
    }

    window.resetGame = function() {
      clearInterval(timerInterval);
      clearInterval(confettiInterval);
      const timerDisp = document.getElementById("timerDisplay");
      timerDisp.className = "timer";
      timerDisp.innerText = "03:00";
      document.getElementById("teamAAvatars").classList.remove("jumping");
      document.getElementById("teamBAvatars").classList.remove("jumping");
      set(gameRef, { ropePosition: 0, scoreRed: 0, scoreBlue: 0, timerSecs: 180, gameOver: false, winner: null });
    };
  </script>
</body>
</html>
