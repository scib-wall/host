<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Changes: Tug-of-War Host</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body { 
      font-family: 'Outfit', sans-serif; 
      text-align: center; 
      color: #f8fafc; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      overflow-x: hidden;
      position: relative;

      /* SUBTLE ANIMATED BACKGROUND */
      background: linear-gradient(-45deg, #0b0f19, #111827, #1e1b4b, #0f172a);
      background-size: 300% 300%;
      animation: smoothBG 16s ease infinite;
    }

    @keyframes smoothBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* MAIN WRAPPER TO KEEP EVERYTHING CONTAINED */
    .host-container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    /* MODERN COMPACT TITLE */
    .game-title {
      font-size: clamp(1.2rem, 2.5vw, 2rem);
      font-weight: 900;
      letter-spacing: 2px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1px;
      text-transform: uppercase;
    }

    .char {
      display: inline-block;
      animation: colorShift 5s ease-in-out infinite;
    }

    .char:nth-child(1) { animation-delay: 0.0s; }
    .char:nth-child(2) { animation-delay: 0.15s; }
    .char:nth-child(3) { animation-delay: 0.3s; }
    .char:nth-child(4) { animation-delay: 0.45s; }
    .char:nth-child(5) { animation-delay: 0.6s; }
    .char:nth-child(6) { animation-delay: 0.75s; }
    .char:nth-child(7) { animation-delay: 0.9s; }
    .char:nth-child(8) { animation-delay: 1.05s; }
    .char:nth-child(9) { animation-delay: 1.2s; }
    .char:nth-child(10) { animation-delay: 1.35s; }
    .char:nth-child(11) { animation-delay: 1.5s; }
    .char:nth-child(12) { animation-delay: 1.65s; }
    .char:nth-child(13) { animation-delay: 1.8s; }
    .char:nth-child(14) { animation-delay: 1.95s; }
    .char:nth-child(15) { animation-delay: 2.1s; }
    .char:nth-child(16) { animation-delay: 2.25s; }

    @keyframes colorShift {
      0% { color: #f8fafc; }
      25% { color: #fb7185; }
      50% { color: #38bdf8; }
      75% { color: #c084fc; }
      100% { color: #f8fafc; }
    }

    /* TIMER DISPLAY */
    .timer { 
      font-size: clamp(1.8rem, 3.5vw, 2.8rem); 
      font-weight: 800; 
      color: #f1f5f9; 
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      transition: all 0.3s;
    }
    .timer.sudden-death { color: #f43f5e; animation: pulseScale 0.6s infinite alternate ease-in-out; }
    @keyframes pulseScale { from { transform: scale(1); } to { transform: scale(1.05); } }

    /* COMPACT DASHBOARD */
    .dashboard { 
      display: flex; 
      justify-content: space-around; 
      width: 100%;
      background: rgba(15, 23, 42, 0.6); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .score { font-size: clamp(1.8rem, 3.5vw, 2.5rem); font-weight: 800; }
    .red-txt { color: #f43f5e; }
    .blue-txt { color: #38bdf8; }

    /* COMPACT ARENA */
    .arena { 
      background: rgba(15, 23, 42, 0.5); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: clamp(25px, 4vw, 45px) 10px; 
      border-radius: 20px; 
      width: 100%;
      position: relative; 
      overflow: hidden; 
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .center-line { 
      position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; 
      background: rgba(244, 63, 94, 0.5); 
      z-index: 1; 
    }

    /* ROPE & CHARACTERS */
    .rope-wrapper { display: flex; align-items: center; justify-content: center; transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); position: relative; z-index: 2; }
    
    .real-rope { 
      width: clamp(160px, 30vw, 320px); 
      height: clamp(10px, 1.2vw, 14px); 
      background: linear-gradient(90deg, #78350f, #d97706, #78350f);
      margin: 0 -8px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); position: relative;
    }

    .center-flag { 
      position: absolute; top: -22px; left: 50%; transform: translateX(-50%); 
      font-size: clamp(1.2rem, 2vw, 1.8rem); 
      animation: flagWiggle 1.5s infinite alternate ease-in-out; 
    }
    @keyframes flagWiggle { from { transform: translateX(-50%) rotate(-6deg); } to { transform: translateX(-50%) rotate(6deg); } }

    .team-players { display: flex; gap: clamp(2px, 0.8vw, 8px); }
    .player-container { 
      position: relative; 
      font-size: clamp(1.5rem, 3vw, 2.5rem); 
      display: inline-block; 
      transition: transform 0.3s ease;
      animation: idleBob 2s infinite alternate ease-in-out;
    }
    @keyframes idleBob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

    .pull-left .player-container { transform: rotate(-15deg) translateX(-6px) scale(1.05); }
    .pull-right .player-container { transform: rotate(15deg) translateX(6px) scale(1.05); }

    .jumping { animation: victoryJump 0.5s infinite alternate cubic-bezier(0.175, 0.885, 0.32, 1.275) !important; }
    @keyframes victoryJump { from { transform: translateY(0) scale(1); } to { transform: translateY(-20px) scale(1.1); } }

    /* CONTROLS */
    .controls { display: flex; gap: 8px; margin-top: 4px; }
    button { 
      padding: 10px 20px; 
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem; 
      font-weight: 700; 
      letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.12); 
      border-radius: 50px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      backdrop-filter: blur(8px);
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0) scale(0.96); }
    .start-btn { background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
    .start-btn:hover { background: rgba(34, 197, 94, 0.35); }
    .reset-btn { background: rgba(244, 63, 94, 0.2); color: #fb7185; border-color: rgba(244, 63, 94, 0.3); }
    .reset-btn:hover { background: rgba(244, 63, 94, 0.35); }
  </style>
</head>
<body>

  <div class="host-container">
    <!-- TITLE -->
    <div class="game-title">
      <span class="char">P</span><span class="char">H</span><span class="char">A</span><span class="char">S</span><span class="char">E</span>
      <span class="char">&nbsp;</span>
      <span class="char">C</span><span class="char">H</span><span class="char">A</span><span class="char">N</span><span class="char">G</span><span class="char">E</span><span class="char">S</span><span class="char">:</span>
      <span class="char">&nbsp;</span>
      <span class="char">T</span><span class="char">U</span><span class="char">G</span><span class="char">-</span><span class="char">O</span><span class="char">-</span><span class="char">W</span><span class="char">A</span><span class="char">R</span>
    </div>

    <div class="timer" id="timerDisplay">03:00</div>

    <div class="dashboard">
      <div>
        <div class="red-txt" style="font-size: 0.85rem; font-weight: 800; letter-spacing: 1px;">TEAM RED</div>
        <div class="score red-txt" id="scoreRed">0</div>
        <div id="playersRed" style="opacity: 0.6; font-weight: 600; font-size: 0.8rem;">0 Players</div>
      </div>
      <div>
        <div class="blue-txt" style="font-size: 0.85rem; font-weight: 800; letter-spacing: 1px;">TEAM BLUE</div>
        <div class="score blue-txt" id="scoreBlue">0</div>
        <div id="playersBlue" style="opacity: 0.6; font-weight: 600; font-size: 0.8rem;">0 Players</div>
      </div>
    </div>

    <div class="arena">
      <div class="center-line"></div>
      <div class="rope-wrapper" id="ropeWrapper">
        <div class="team-players" id="teamAAvatars">
          <div class="player-container">🏃‍♂️</div>
          <div class="player-container">🤼‍♀️</div>
          <div class="player-container">🏃‍♂️</div>
        </div>

        <div class="real-rope" id="realRope">
          <div class="center-flag">🚩</div>
        </div>

        <div class="team-players" id="teamBAvatars">
          <div class="player-container">🏃‍♀️</div>
          <div class="player-container">🤼‍♂️</div>
          <div class="player-container">🏃‍♀️</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="start-btn" onclick="startGame()">▶ START MATCH</button>
      <button class="reset-btn" onclick="resetGame()">🔄 RESET</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY",
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com",
      projectId: "tug-of-war-game-f18b3",
      storageBucket: "tug-of-war-game-f18b3.firebasestorage.app",
      messagingSenderId: "797664292032",
      appId: "1:797664292032:web:781e254da90da2c43e5125"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameRef = ref(db, "game/state");
    const presenceRef = ref(db, "game/presence");

    let timerInterval = null, confettiInterval = null, lastPos = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    onValue(gameRef, (snapshot) => {
      const data = snapshot.val() || {};
      const pos = data.ropePosition || 0;

      if (pos !== lastPos) {
        triggerPullFX(pos < lastPos ? "A" : "B");
        lastPos = pos;
      }

      const shiftPct = (pos / 100) * 35;
      document.getElementById("ropeWrapper").style.transform = `translateX(${shiftPct}%)`;

      document.getElementById("scoreRed").innerText = data.scoreRed || 0;
      document.getElementById("scoreBlue").innerText = data.scoreBlue || 0;

      if (data.gameOver) {
        clearInterval(timerInterval);
        handleWinnerDisplay(data.winner, pos);
      }
    });

    onValue(presenceRef, (snapshot) => {
      const data = snapshot.val() || {};
      let red = 0, blue = 0;
      Object.values(data).forEach(p => { if (p.team === "A") red++; else blue++; });
      document.getElementById("playersRed").innerText = `${red} Players`;
      document.getElementById("playersBlue").innerText = `${blue} Players`;
    });

    function triggerPullFX(pullingTeam) {
      const teamA = document.getElementById("teamAAvatars");
      const teamB = document.getElementById("teamBAvatars");

      if (pullingTeam === "A") teamA.classList.add("pull-left");
      else teamB.classList.add("pull-right");

      playSound(120, "sawtooth", 0.12);

      setTimeout(() => {
        teamA.classList.remove("pull-left");
        teamB.classList.remove("pull-right");
      }, 300);
    }

    window.startGame = function() {
      let timeLeft = 180;
      clearInterval(timerInterval); clearInterval(confettiInterval);
      set(gameRef, { ropePosition: 0, scoreRed: 0, scoreBlue: 0, timerSecs: 180, gameOver: false, winner: null });

      timerInterval = setInterval(() => {
        timeLeft--;
        const timerDisp = document.getElementById("timerDisplay");

        if (timeLeft <= 30) {
          timerDisp.className = "timer sudden-death";
          timerDisp.innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
        } else {
          timerDisp.className = "timer";
          const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
          const s = (timeLeft % 60).toString().padStart(2, '0');
          timerDisp.innerText = `${m}:${s}`;
        }

        set(gameRef, { ...getLatestState(), timerSecs: timeLeft });

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          let state = getLatestState();
          let winner = state.ropePosition < 0 ? "A" : (state.ropePosition > 0 ? "B" : "TIE");
          set(gameRef, { ...state, gameOver: true, winner: winner });
        }
      }, 1000);
    };

    function handleWinnerDisplay(winner, pos) {
      const teamA = document.getElementById("teamAAvatars");
      const teamB = document.getElementById("teamBAvatars");
      teamA.classList.remove("jumping"); teamB.classList.remove("jumping");

      if (winner === "A" || pos < 0) { teamA.classList.add("jumping"); triggerVictoryFanfare(); }
      else if (winner === "B" || pos > 0) { teamB.classList.add("jumping"); triggerVictoryFanfare(); }
    }

    function triggerVictoryFanfare() {
      playSound(523.25, "triangle", 0.3);
      setTimeout(() => playSound(659.25, "triangle", 0.3), 150);
      setTimeout(() => playSound(783.99, "triangle", 0.6), 300);

      clearInterval(confettiInterval);
      confettiInterval = setInterval(() => { confetti({ particleCount: 40, spread: 60, origin: { y: 0.6 } }); }, 600);
    }

    function getLatestState() {
      let r = parseInt(document.getElementById("scoreRed").innerText) || 0;
      let b = parseInt(document.getElementById("scoreBlue").innerText) || 0;
      return { scoreRed: r, scoreBlue: b, ropePosition: lastPos };
    }

    window.resetGame = function() {
      clearInterval(timerInterval); clearInterval(confettiInterval);
      const timerDisp = document.getElementById("timerDisplay");
      timerDisp.className = "timer"; timerDisp.innerText = "03:00";
      document.getElementById("teamAAvatars").classList.remove("jumping");
      document.getElementById("teamBAvatars").classList.remove("jumping");
      set(gameRef, { ropePosition: 0, scoreRed: 0, scoreBlue: 0, timerSecs: 180, gameOver: false, winner: null });
    };
  </script>
</body>
</html>
